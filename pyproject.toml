[project]
name = "tonypi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rodricksia", email = "doquocduy698@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mujoco>=3.2.0",
    "gymnasium>=1.0.0",
    "numpy>=1.26",
    "stable-baselines3>=2.3.0",
    "torch>=2.3.0",
    "tensorboard>=2.17.0",
    "imageio[ffmpeg]>=2.34.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
]

[project.scripts]
tonypi = "tonypi:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
